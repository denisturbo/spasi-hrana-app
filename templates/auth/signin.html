{%extends 'base.html'%}

{%block head_title%}{{ block.super }} | Влез в акаунт{%endblock%}

{%block content%}

<section class="bg-gray-50 lg:py-24">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto ">
      <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 ">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl ">
                  Влез в акаунта си
              </h1>
              <form class="space-y-4 md:space-y-6" action="#">
                  <div>
                      <label for="email" class="block mb-2 text-sm font-medium text-gray-900 ">Твоят e-mail</label>
                      <input type="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-600 focus:border-orange-600 block w-full p-2.5" placeholder="ivan@petrov.bg" required="">
                  </div>
                  <div>
                      <label for="password" class="block mb-2 text-sm font-medium text-gray-900 ">Парола</label>
                      <input type="password" name="password" id="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-600 focus:border-orange-600 block w-full p-2.5 " required="">
                  </div>
                  <div class="flex items-center justify-between">
                      <div class="flex items-start">
                          <div class="flex items-center h-5">
                            <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-orange-300 " required="">
                          </div>
                          <div class="ml-3 text-sm">
                            <label for="remember" class="text-gray-500 ">Запомни ме </label>
                          </div>
                      </div>
                      <a href="#" class="text-sm font-medium text-orange-600 hover:underline">Забравена парола?</a>
                  </div>
                  <button type="submit" class="w-full text-white bg-orange-600 hover:bg-orange-700 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Влез</button>
                  <p class="text-sm font-light text-gray-500 ">
                      Ако нямаш профил. <a href="#" class="font-medium text-orange-500 hover:underline">Създай от тук</a>
                  </p>
              </form>
          </div>
      </div>
    </div> 
</section>

{%endblock%}
