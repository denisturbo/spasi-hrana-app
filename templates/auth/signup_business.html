{%extends 'base.html'%}


{%block content%}
<section class="bg-gray-50 lg:py-24">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto ">
      <div class="w-full bg-white rounded-lg shadow  sm:max-w-md xl:p-0 ">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                  Създай акаунт - ЗА БИЗНЕСИ
              </h1>
              <form method='POST' class="space-y-4 md:space-y-6" action="{% url 'business-signup' %}">
                {%csrf_token%}
                  <div>
                     {{form}}
                  </div>


                <div class="block mb-2 text-sm font-medium text-red-600">
                {{ form.non_field_errors }}
                </div>
<input class="w-full text-white bg-orange-600 hover:bg-orange-700 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center" type="submit" value="Влез">
<input type="hidden" name="next" value="{{ next }}">

                  <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                      Вече имате акаунт? <a href="{%url 'signin' %}" class="font-medium text-orange-600 hover:underline dark:text-orange-500">Вход</a>
                  </p>
              </form>
          </div>
      </div>
  </div>
</section>

{%endblock%}
