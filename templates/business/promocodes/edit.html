{% extends 'business/main.html' %}

{% block title %} | Промени Промокод {% endblock %}
{% block content %}

    <section class="flex items-center justify-center py-16">
        <div class="w-full max-w-2xl p-6 bg-white">
            <h2 class="mb-4 text-xl font-bold text-gray-900 ">Промени промокод</h2>
            <form method='POST' enctype="multipart/form-data" action="{% url 'promocodes:edit' promocode.id %}">
                {% csrf_token %}
                <div class="grid gap-6 mb-6">
                    <label for="{{ form.listing.id_for_label }}"
                           class="block text-sm font-medium text-gray-900">Продукт</label>
                    <button id="dropdownBgHoverButton" data-dropdown-toggle="dropdownBgHover"
                            class="text-white bg-orange-700 hover:bg-orange-800 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center dark:bg-orange-600 dark:hover:bg-orange-700 dark:focus:ring-orange-800"
                            type="button">Избери продукти
                        <svg class="w-2.5 h-2.5 ms-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="m1 1 4 4 4-4"/>
                        </svg>
                    </button>
                    <div id="dropdownBgHover" class="z-10 hidden w-48 bg-white rounded-lg shadow-sm">
                        <ul class="p-3 space-y-1 text-sm text-gray-700" aria-labelledby="dropdownBgHoverButton">
                            {% for option in form.listing %}
                                <li>
                                    <div class="flex items-center p-2 rounded-sm hover:bg-gray-100">
                                        {{ option }}
                                    </div>
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                    <div class="grid gap-6 mb-6">
                        <div>
                            <label for="{{ form.percentage_off.id_for_label }}"
                                   class="block mb-2 text-sm font-medium text-gray-900">Проценти намаление</label>
                            {{ form.percentage_off }}
                        </div>
                    </div>
                    <div class="grid gap-6 mb-6">
                        <div>
                            <label for="{{ form.code.id_for_label }}"
                                   class="block mb-2 text-sm font-medium text-gray-900">Промокод</label>
                            {{ form.code }}
                        </div>
                        <div>
                            <div class="flex items-center space-x-4">
                                <input class="text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
                                       type="submit" value="Промени">
                                <input type="hidden" name="next" value="{{ next }}">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>

{% endblock %}
