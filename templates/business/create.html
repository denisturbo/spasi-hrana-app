{% extends "base.html" %}
{%block head_title%} Създаване {%endblock %}

{% block content%}
 <section class=" flex items-center justify-center py-12">
  <div class="w-full max-w-2xl p-6 bg-white">
      <h2 class="mb-4 text-xl font-bold text-gray-900 ">Добави продукт</h2>
        <form method='POST' enctype="multipart/form-data" action="{% url 'listingcreation' %}">
            {%csrf_token%}
          <div class="grid gap-4 mb-4 sm:grid-cols-2 sm:gap-6 sm:mb-5">
              <div class="sm:col-span-2">
                    <label for="{{ form.title.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900">Име на продукта</label>
                  {{form.title}}
              </div>
              <div class="h-full">
                    <label for="{{ form.price.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900">Цена</label>
                  {{form.price}}
              </div>
              <div class="max-w-lg">
                    <label for="{{ form.image.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900">Снимка на продукта</label>
                  {{form.image}}
              <div class="mt-1 text-sm text-gray-500">Добави снимка на продукта (16:9 формат)</div>
              </div>
              <div class="sm:col-span-2">
                {{form.description.label}}
                  {{form.description}}
              </div>    
          </div>
          <div class="flex items-center space-x-4">
            <input class="text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center" type="submit" value="Добави">
            <input type="hidden" name="next" value="{{ next }}">   
          </div>
      </form>
  </div>
</section>
{% endblock content%}
