{% extends "base.html" %}
{%block head_title%} Създаване {%endblock %}

{% block content%}

<section>
  <div>
    <form method='POST' class="space-y-4 md:space-y-6" action="{% url 'listingcreation' %}">
      {%csrf_token%}
      {%for f in form%}
        <div>
          {{f.label}}
          {{f}}
        </div>
      {%endfor%}
      <input class="w-full text-white bg-orange-600 hover:bg-orange-700 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center" type="submit" value="Добави">
      <input type="hidden" name="next" value="{{ next }}">   
    </form>
  </div>
</section>



{% endblock content%}
