<button type="button" class="flex items-center justify-center text-sm bg-gray-800 rounded-full mr-2 focus:ring-4 focus:ring-gray-300" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown" data-dropdown-placement="bottom">
    <span class="sr-only">Отвори меню</span>
    {% if user.user_type == 'business'%}
    <img class="w-10 h-10 rounded-full" src="{{business.profile_picture.url}}" alt="user photo">
    {%else%}
    <img class="w-10 h-10 rounded-full" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="user photo">
    {%endif%}
</button>

      <!-- Dropdown menu -->
      <div class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-lg shadow-sm" id="user-dropdown">
        <div class="px-4 py-3">
          <span class="block text-sm text-gray-900" >{{user.username}}</span>
          <span class="block text-sm  text-gray-500 truncate ">
        {{user.get_user_type_display}}
          </span>
        </div>
        <ul class="py-2" aria-labelledby="user-menu-button">
          <li>  
            <a href="{%url 'profile'%}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 ">Моят профил</a>
          </li>
          <li>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Настройки</a>
          </li>
          <li class="hover:bg-gray-100">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:cursor-pointer">
                Излез
              </button>
            </form>
          </li>
        </ul>
      </div>
