<button
  type="button"
  class="flex mx-3 text-sm bg-gray-800 rounded-full md:mr-0 focus:ring-4 focus:ring-gray-300"
  id="user-menu-button"
  aria-expanded="false"
  data-dropdown-toggle="dropdown"
>
  <span class="sr-only">Open user menu</span>
  {% if request.user.businessuser.profile_picture%}
  <img
    class="w-8 h-8 rounded-full"
    src="{{request.user.businessuser.profile_picture.url}}"
    alt="user photo"
  />
  {%else%}
    <img
    class="w-8 h-8 rounded-full"
    src="{{'#'}}"
    alt="user photo"
  />
  {%endif%}
</button>
<!-- Dropdown menu -->
<div
  class="hidden z-50 my-4 w-56 text-base list-none bg-white rounded divide-y divide-gray-100 shadow"
  id="dropdown"
>
  <div class="py-3 px-4">
    <span
      class="block text-sm font-semibold text-gray-900"
      >{{business.business_name}}</span
    >
    <span
      class="block text-sm text-gray-900 truncate"
      >{{user.email}}</span
    >
  </div>
  <ul
    class="py-1 text-gray-700-300"
    aria-labelledby="dropdown"
  >
    <li>
      <a
        href="{% url 'delete_account' %}"
        class="block py-2 px-4 text-sm hover:bg-gray-100"
        >Настройки</a
      >
    </li>
  </ul>
  <ul
    class="py-1 text-gray-700-300"
    aria-labelledby="dropdown"
  >
          <li class="hover:bg-gray-100">
  <form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:cursor-pointer">
    Излез
  </button>
  </form>
            </li>
  </ul>
</div>
